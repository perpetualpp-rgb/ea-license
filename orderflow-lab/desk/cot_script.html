    const x = i => plot.l + i / (n - 1) * (plot.r - plot.l), y = v => plot.b - (v - lo) / (hi - lo) * (plot.b - plot.t);
    ctx.font = "11px 'IBM Plex Mono', ui-monospace, monospace"; ctx.textBaseline = "middle";
    const span = hi - lo, raw = span / 6, mag = Math.pow(10, Math.floor(Math.log10(raw))), step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => span / s <= 6);
    for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) {
      ctx.strokeStyle = Math.abs(v) < 1e-9 ? T.axis : T.grid; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(plot.l, Math.round(y(v)) + 0.5); ctx.lineTo(plot.r, Math.round(y(v)) + 0.5); ctx.stroke();
      ctx.fillStyle = T.muted; ctx.textAlign = "right"; ctx.fillText(Math.abs(v) < 1e-9 ? "0" : (v > 0 ? "+" : "−") + Math.abs(v / 1000).toFixed(0) + "k", plot.l - 8, y(v));
    }
    ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
    COT.forEach((r, i) => { const [yy, mm, dd] = r[0].split("-").map(Number); const pm = i ? Number(COT[i - 1][0].split("-")[1]) : 0; if ((mm === 1 || mm === 7) && pm !== mm) { ctx.fillStyle = T.muted; ctx.fillText(`${TH_M[mm - 1]} ${yy}`, Math.min(plot.r - 24, Math.max(plot.l + 24, x(i))), h - 6); } });
    lines.forEach((g, k) => {
      ctx.strokeStyle = T.c[k]; ctx.lineWidth = 2; ctx.lineJoin = "round"; ctx.beginPath();
      COT.forEach((r, i) => i ? ctx.lineTo(x(i), y(net(r, g))) : ctx.moveTo(x(i), y(net(r, g)))); ctx.stroke();
      const ey = y(net(COT[n - 1], g)); ctx.beginPath(); ctx.arc(x(n - 1), ey, 4.5, 0, Math.PI * 2); ctx.fillStyle = T.surface; ctx.fill(); ctx.beginPath(); ctx.arc(x(n - 1), ey, 3.5, 0, Math.PI * 2); ctx.fillStyle = T.c[k]; ctx.fill();
    });
    if (labelW) {
      const labs = lines.map((g, k) => ({ k, y: y(net(COT[n - 1], g)), t: `${g.tag} ${sgn(net(COT[n - 1], g))}` })).sort((a, b) => a.y - b.y);
      for (let i = 1; i < labs.length; i++) if (labs[i].y - labs[i - 1].y < 15) labs[i].y = labs[i - 1].y + 15;
      ctx.textAlign = "left"; ctx.textBaseline = "middle"; ctx.font = "12px 'IBM Plex Sans Thai', system-ui, sans-serif";
      for (const lb of labs) { ctx.fillStyle = T.ink2; ctx.fillText(lb.t, plot.r + 10, lb.y); }
    }
    if (hover != null) { ctx.save(); ctx.strokeStyle = T.axis; ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.moveTo(x(hover), plot.t); ctx.lineTo(x(hover), plot.b); ctx.stroke(); ctx.restore(); }
    L = { plot, x };
  }

  function onMove(ev) {
    if (!L) return;
    const r = $("cvCot").getBoundingClientRect(), px = ev.clientX - r.left;
    if (px < L.plot.l || px > L.plot.r) { hover = null; $("tipCot").hidden = true; draw(); return; }
    hover = Math.round((px - L.plot.l) / (L.plot.r - L.plot.l) * (n - 1));
    const row = COT[hover], tip = $("tipCot");
    tip.innerHTML = `${dlabel(row[0])}<br>` + G.slice(0, 3).map(g => `${g.tag} ${sgn(net(row, g))}`).join("<br>") + `<br>OI ${fmt(row[1])}`;
    tip.hidden = false;
    const card = $("cardCot").getBoundingClientRect(), cx = ev.clientX - card.left, cy = ev.clientY - card.top;
    tip.style.left = Math.max(8, Math.min(card.width - tip.offsetWidth - 8, cx + 14)) + "px"; tip.style.top = Math.max(8, cy - tip.offsetHeight - 12) + "px";
    draw();
  }

  function init() {
    table(); draw();
    $("cvCot").addEventListener("mousemove", onMove);
    $("cvCot").addEventListener("mouseleave", () => { hover = null; $("tipCot").hidden = true; draw(); });
    let t; window.addEventListener("resize", () => { clearTimeout(t); t = setTimeout(draw, 120); });
    new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
    try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw); } catch { /* old browsers */ }
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init); else init();
})();
</script>
